name: Bug report
description: Something is broken or incorrect in the SDK, examples, or docs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, follow [SECURITY.md](https://github.com/autlantic/payments-sdk/blob/main/SECURITY.md) instead.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "@autlantic/payments-recurring"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: npm version you are using
      placeholder: "0.2.5"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Sandbox
        - Hosted API (test)
        - Hosted API (live)
        - Docs / examples only
        - Unsure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear summary of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet.
      placeholder: |
        1. Install @autlantic/payments-recurring
        2. Call …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: This is not a security vulnerability (those go to support@autlantic.com)
          required: true
