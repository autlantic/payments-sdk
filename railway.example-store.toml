# Autlantic example subscription store (webhook demo)
# Railway: Settings → Config-as-code → Config file path → railway.example-store.toml

[build]
builder = "NIXPACKS"
# Build SDK packages first (core → chain → engine → client), then the Next example.
buildCommand = "pnpm build && pnpm --filter @autlantic/example-subscription-store build"
watchPatterns = [
  "examples/subscription-store/**",
  "packages/**",
  "railway.example-store.toml",
  "pnpm-lock.yaml",
]

[deploy]
startCommand = "pnpm --filter @autlantic/example-subscription-store exec next start -H 0.0.0.0 -p $PORT"
restartPolicyType = "ON_FAILURE"
